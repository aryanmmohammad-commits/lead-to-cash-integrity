[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "l2c"
version = "0.1.0"
description = "Synthetic HubSpot and Younium lead-to-cash integrity demo"
requires-python = ">=3.11"
dependencies = [
    "duckdb==2.0.0",
    "dbt-duckdb==1.11.0",
    "pandas==3.1.0",
    "faker==40.43.0",
    "pyyaml==6.0.3",
    "pydantic==2.13.4",
    "typer==0.16.0",
    "openpyxl==3.1.5",
    "jinja2==3.1.6",
    "requests==2.32.3",
    "tenacity==9.2.1",
    "pytest==8.4.2",
    "ruff==0.17.2",
]

[project.scripts]
l2c = "l2c.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
l2c = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
