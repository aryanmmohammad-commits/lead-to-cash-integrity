[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "l2c"
version = "0.1.0"
description = "Synthetic HubSpot and Younium lead-to-cash integrity demo"
requires-python = ">=3.11"
dependencies = [
    "duckdb",
    "dbt-duckdb",
    "pandas",
    "faker",
    "pyyaml",
    "pydantic>=2,<3",
    "typer>=0.12",
    "openpyxl",
    "jinja2",
    "requests",
    "tenacity",
    "pytest",
    "ruff",
]

[project.scripts]
l2c = "l2c.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
