hubspot_companies:
  file: hubspot_companies.csv
  format:
    delimiter: ','
    encoding: utf-8-sig
    date_format: '%Y-%m-%d'
    decimal: .
    thousands: ''
  columns:
    company_id: Record ID
    name: Company name
    domain: Company domain name
    country: Country/Region
    city: City
    owner_id: HubSpot owner
    territory: Territory
    tier: Tier
    younium_account_number: Younium Account Number
    created_at: Create date
  values: {}
hubspot_contacts:
  file: hubspot_contacts.csv
  format:
    delimiter: ','
    encoding: utf-8-sig
    date_format: '%Y-%m-%d'
    decimal: .
    thousands: ''
  columns:
    contact_id: Record ID
    email: Email
    company_id: Primary Associated Company ID
    lifecycle_stage: Lifecycle Stage
    lead_status: Lead Status
    original_source: Original Traffic Source
    owner_id: HubSpot owner
    created_at: Create date
  values:
    lifecycle_stage:
      Subscriber: subscriber
      Lead: lead
      Marketing Qualified Lead: marketingqualifiedlead
      Sales Qualified Lead: salesqualifiedlead
      Opportunity: opportunity
      Customer: customer
      Evangelist: evangelist
      Other: other
    lead_status:
      New: NEW
      Open: OPEN
      In Progress: IN_PROGRESS
      Open Deal: OPEN_DEAL
      Unqualified: UNQUALIFIED
      Attempted to Contact: ATTEMPTED_TO_CONTACT
      Connected: CONNECTED
      Bad Timing: BAD_TIMING
    original_source:
      Organic Search: ORGANIC_SEARCH
      Paid Search: PAID_SEARCH
      Email Marketing: EMAIL_MARKETING
      Social Media: SOCIAL_MEDIA
      Referrals: REFERRALS
      Other Campaigns: OTHER_CAMPAIGNS
      Direct Traffic: DIRECT_TRAFFIC
      Offline: OFFLINE
      Paid Social: PAID_SOCIAL
hubspot_deals:
  file: hubspot_deals.csv
  format:
    delimiter: ','
    encoding: utf-8-sig
    date_format: '%Y-%m-%d'
    decimal: .
    thousands: ''
  columns:
    deal_id: Record ID
    deal_name: Deal Name
    company_ids: Associated company IDs
    deal_type: Deal Type
    motion: Deal Motion
    stage: Deal Stage
    amount: Amount
    currency: Currency
    close_date: Close Date
    contract_start: Contract Start Date
    contract_end: Contract End Date
    term_months: Term (months)
    billing_frequency: Billing Frequency
    owner_id: HubSpot owner
    created_at: Create date
  values:
    stage:
      Appointment Scheduled: appointmentscheduled
      Qualified to Buy: qualifiedtobuy
      Presentation Scheduled: presentationscheduled
      Decision Maker Bought-In: decisionmakerboughtin
      Contract Sent: contractsent
      Closed Won: closedwon
      Closed Lost: closedlost
    motion:
      New Business: new
      Upsell: upsell
      Renewal: renewal
    deal_type:
      New Business: newbusiness
      Existing Business: existingbusiness
